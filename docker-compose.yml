services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthsphere
      POSTGRES_PASSWORD: healthsphere
      POSTGRES_DB: healthsphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://healthsphere:healthsphere@postgres:5432/healthsphere
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret-please-32chars+}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: